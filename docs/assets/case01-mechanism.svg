<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Case 01: routing and logged scans are different analysis populations</title><desc id="desc">Random routing supports intention-to-treat analysis. Missing new-station scans change the logged-scan population. Routing-level SRM passes, scan-level SRM fails, and the triggered estimate is not trustworthy in this case.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1000" height="550" rx="20" fill="#f5f7fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="43" font-size="24" font-weight="700" fill="#172b4d">Same experiment, different analysis populations</text><text x="32" y="72" font-size="16" fill="#42526e">Case 01 · Mechanism illustration, not an empirical results plot</text><rect x="32" y="110" width="260" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="32" y="110" width="6" height="130" rx="3" fill="#2563eb"/><text x="52" y="142" font-size="19" font-weight="700" fill="#172b4d">Random routing</text><text x="52" y="171" font-size="16" fill="#42526e">Old and new station</text><text x="52" y="195" font-size="16" fill="#42526e">Routing-level SRM passes</text><rect x="352" y="110" width="290" height="130" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="352" y="110" width="6" height="130" rx="3" fill="#0f766e"/><text x="372" y="142" font-size="19" font-weight="700" fill="#172b4d">All routed products</text><text x="372" y="171" font-size="16" fill="#42526e">Intention-to-treat analysis</text><text x="372" y="195" font-size="16" fill="#42526e">ITT remains valid in this case</text><rect x="352" y="305" width="290" height="155" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/><rect x="352" y="305" width="6" height="155" rx="3" fill="#b45309"/><text x="372" y="337" font-size="19" font-weight="700" fill="#172b4d">Logged scans</text><text x="372" y="366" font-size="16" fill="#42526e">New-station scans missing</text><text x="372" y="390" font-size="16" fill="#42526e">for one component batch</text><text x="372" y="414" font-size="16" fill="#42526e">Scan-level SRM fails</text><rect x="705" y="305" width="260" height="155" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/><rect x="705" y="305" width="6" height="155" rx="3" fill="#b45309"/><text x="725" y="337" font-size="19" font-weight="700" fill="#172b4d">Triggered analysis</text><text x="725" y="366" font-size="16" fill="#42526e">Selected analysis population</text><text x="725" y="390" font-size="16" fill="#42526e">Triggered estimate invalid</text><text x="725" y="414" font-size="16" fill="#42526e">in this case</text><path d="M 292 175 L 352 175" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M162 240 L162 382 L352 382" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 642 382 L 705 382" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="32" y="505" font-size="17" fill="#172b4d">A passing routing-level SRM check does not validate a scan-filtered comparison.</text></g></svg>