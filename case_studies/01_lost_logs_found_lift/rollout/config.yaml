# Case 01 rollout: the repaired station re-released through a staged rollout.
# Everything here is simulated.
# Shared values (baseline, lift, legacy route, incident segment, ship floor) equal the Case 01
# config.yaml; tests/unit/test_assembly_rollout.py checks that they match.
# Seed history (kept here because a squash merge drops branch history): on 2026-10-24 the
# date-pattern seeds 20261101 (run) and 20261102 (operating characteristics) were replaced, at
# the author's request and for the pattern alone, by one draw each of Python secrets.randbits(32).
# The earlier run had been seen: its operating characteristics raised one flag (S2,
# day-standardised mean relative estimate +3.1 MCSE), investigated with 160,000 further
# replicates as Monte Carlo variation (bias 0.018 points, 95% interval -0.002 to 0.037).
seed: 4180576477                     # committed product-level run (random draw, see above)
days: 28
eligible_products_per_day: 20000
schedule:                            # routing probability to the new station, by stage
  - {days: [1, 7], p: 0.01}
  - {days: [8, 14], p: 0.10}
  - {days: [15, 28], p: 0.50}
baseline_yield_rate: 0.032
true_relative_lift: 0.03             # among products that reach the scanner
legacy_route_probability: 0.15
trend_kappa: 0.003125                # g_d = 1 + kappa (d - 14.5): baseline 0.0306 on day 1 to 0.0334 on day 28
outcome_window_days: 7
incident:
  enabled: false                     # the repaired station; S3 switches the defect on
  supply_line: A
  batch_below: "4"
  scan_loss_probability: 0.35
  affects_arm: treatment
decision_rule:
  ship_if_lower_bound_above_relative: 0.01
canary:
  alpha: 0.001                       # per look, one look per stage
operating_characteristics:
  seed: 2843733299                 # random draw, see the seed history above
  replicates: 5000                   # B for S0 (each sweep point), S1 and S2
  canary_replicates: 10000           # B for S3 at every stage
  kappa_sweep: [0.0, 0.0015625, 0.003125, 0.00625]
  s2_stage_lifts: [0.0, 0.015, 0.03] # lift among products that reach the scanner, stages 1 to 3
