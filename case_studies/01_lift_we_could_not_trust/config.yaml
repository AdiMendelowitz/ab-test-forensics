# Case 01: The lift we could not trust. Parameters of the semi-synthetic experiment.
# Every value here is logged to the manifest when data is generated.
# Seed selection rule (stated so it can be checked; tests/simulation/test_case_seed.py
# re-applies it): the case seed is the first seed from 20260928 upwards whose single run
# shows the case's story, namely the day-14 dashboard clears the ship rule, the
# complete-data ITT interval lands in the continue zone (lower bound at or below +1.0%, upper
# bound at or above 0) and the assignment SRM check passes. The rule was written during the
# generator rework, after 20260928 failed it under an intermediate version; under the final
# generator 20260928, the first candidate, meets it. How often a random seed shows the story
# is measured by `abf oc` (results/case01/oc_story.csv).
seed: 20260928
days: 14
eligible_users_per_day: 20000
allocation: {control: 0.5, treatment: 0.5}
baseline_order_rate: 0.032
true_relative_lift: 0.03         # among users whose widget renders; ITT truth is diluted
non_render_probability: 0.15     # arm-independent share of eligible users with no widget render
affected_cell_logit_offset: -0.30  # conversion deficit of Android below 8.4 (logit scale)
outcome_window_days: 7
decision_rule:
  ship_if_lower_bound_above_relative: 0.01
  # Guardrail non-inferiority margins (product inputs, like the ship threshold) on the
  # treatment-minus-control difference: a guardrail passes when the upper 95% bound is at or
  # below its margin, breaches when the lower 95% bound is above it, and is inconclusive
  # otherwise. Payment-step errors and latency must pass for a ship; at no true effect the
  # payment-step guardrail passes about 95% of the time at 140,000 users per arm. Refunds are
  # a breach-only guardrail: a breach stops the launch, and a pass is not required, because
  # passing a +10% margin at no true effect happens only about 18% of the time on a complete
  # 14-day cohort (about 4,500 orders per arm at a 5% refund rate) and 80% of the time would
  # need about 33,000 orders per arm. +10% is the harm tolerance: at the +1.0% ship floor, a
  # refund increase above +18.8% would cancel the gain in kept orders. (During the review on
  # 29 September the refund margin was briefly raised to +25% to make a pass reachable; it was
  # restored to +10% as breach-only. The committed run's refund verdict is the same under
  # every version: inconclusive, no breach.)
  guardrails:
    payment_step_error_max_increase_absolute: 0.003  # must pass
    latency_p95_max_increase_relative: 0.05          # must pass; user-clustered bootstrap
    refund_rate_max_increase_relative: 0.10          # breach-only
incident:
  platform: android
  app_version_below: "8.4"
  exposure_loss_probability: 0.35
  affects_arm: treatment
order_pipeline:
  arrival_delay_hours: {min: 0, max: 36}
operating_characteristics:
  seed: 20261001                   # distinct from the case seed; replicates never reuse it
  replicates: 5000                 # B per scenario (A to D, F) and per loss-sweep point
  sweep_replicates: 1000           # B per conversion-deficit sweep point (runtime budget)
  scenario_lift: 0.03              # tau among rendered users for C, D, F and both sweeps
  loss_probability_sweep: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
  affected_cell_logit_offset_sweep: [-0.6, -0.5, -0.4, -0.3, -0.2, -0.1, 0.0]
